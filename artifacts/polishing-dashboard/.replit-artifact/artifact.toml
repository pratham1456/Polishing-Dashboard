kind = "web"
previewPath = "/"
title = "Polishing Workstation"
description = "A real-time industrial HMI dashboard for a part polishing and buffing workstation, with production analytics, operator metrics, cycle tracking, camera status, and FastAPI WebSocket integration."
version = "1.0.0"
id = "artifacts/polishing-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23008

[services.development]
run = "pnpm --filter @workspace/polishing-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/polishing-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/polishing-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23008"
BASE_PATH = "/"
